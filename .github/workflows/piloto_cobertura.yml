name: Piloto cobertura medica EPHC 2024
on:
  push:
    branches:
      - experimento-cobertura-clustering-2024
  workflow_dispatch:
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar piloto EPHC 2024
        run: python -m src.cobertura_piloto.ejecutar
      - name: Descargar resultados reproducibles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-cobertura-2024
          path: output/piloto_cobertura/
          if-no-files-found: warn
